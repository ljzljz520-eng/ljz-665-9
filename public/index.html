<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水厂泵站设备档案管理系统</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <span class="brand-logo">泵</span>
        <div>
          <h1>水厂泵站设备档案管理系统</h1>
          <p class="brand-sub">Pump Station Equipment Archive</p>
        </div>
      </div>
      <div class="header-right">
        <span class="driver-badge" id="driverBadge">数据驱动：-</span>
        <span class="operator">操作人：<strong>admin</strong></span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 统计卡片 -->
    <section class="stats" id="statsBar">
      <div class="stat-card stat-total">
        <span class="stat-num" id="statTotal">-</span>
        <span class="stat-label">设备总数</span>
      </div>
      <div class="stat-card stat-run">
        <span class="stat-num" id="statRun">-</span>
        <span class="stat-label">运行</span>
      </div>
      <div class="stat-card stat-standby">
        <span class="stat-num" id="statStandby">-</span>
        <span class="stat-label">备用</span>
      </div>
      <div class="stat-card stat-repair">
        <span class="stat-num" id="statRepair">-</span>
        <span class="stat-label">检修</span>
      </div>
      <div class="stat-card stat-stopped">
        <span class="stat-num" id="statStopped">-</span>
        <span class="stat-label">停用</span>
      </div>
      <div class="stat-card stat-power">
        <span class="stat-num" id="statPower">-</span>
        <span class="stat-label">总功率(kW)</span>
      </div>
    </section>

    <!-- 搜索栏 -->
    <section class="toolbar card">
      <div class="search-row">
        <div class="field grow">
          <label for="kwInput">关键字</label>
          <input type="text" id="kwInput" placeholder="设备编号 / 名称 / 泵站 / 位置 / 班组 / 厂家 / 型号" />
        </div>
        <div class="field">
          <label for="stationInput">泵站名称</label>
          <input type="text" id="stationInput" list="stationList" placeholder="全部泵站" autocomplete="off" />
          <datalist id="stationList"></datalist>
        </div>
        <div class="field field-status">
          <label for="statusSelect">运行状态</label>
          <select id="statusSelect">
            <option value="">全部状态</option>
            <option value="运行">运行</option>
            <option value="备用">备用</option>
            <option value="检修">检修</option>
            <option value="停用">停用</option>
          </select>
        </div>
        <div class="toolbar-btns">
          <button class="btn btn-primary" id="btnSearch">查询</button>
          <button class="btn btn-default" id="btnReset">重置</button>
        </div>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-success" id="btnCreate">＋ 新建设备档案</button>
      </div>
    </section>

    <!-- 设备列表 -->
    <section class="card table-card">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:60px">序号</th>
              <th>泵站名称</th>
              <th>设备编号</th>
              <th>设备名称</th>
              <th class="num">功率(kW)</th>
              <th>安装位置</th>
              <th>责任班组</th>
              <th>投运日期</th>
              <th>运行状态</th>
              <th style="width:170px">操作</th>
            </tr>
          </thead>
          <tbody id="equipmentTbody">
            <tr><td colspan="10" class="loading-cell">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <!-- 新建/编辑弹窗 -->
  <div class="modal-mask" id="formModal" hidden>
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="formTitle">新建设备档案</h3>
        <button class="modal-close" data-close="formModal">×</button>
      </div>
      <div class="modal-body">
        <form id="equipmentForm" novalidate>
          <input type="hidden" id="fId" />
          <fieldset>
            <legend>基础信息</legend>
            <div class="form-grid">
              <div class="form-item">
                <label><em>*</em>泵站名称</label>
                <input type="text" id="fStationName" maxlength="100" placeholder="如：一厂取水泵站" required />
              </div>
              <div class="form-item">
                <label><em>*</em>设备编号</label>
                <input type="text" id="fDeviceCode" maxlength="50" placeholder="如：PS1-QSB-001" required />
              </div>
              <div class="form-item">
                <label><em>*</em>设备名称</label>
                <input type="text" id="fDeviceName" maxlength="100" placeholder="如：1#取水泵" required />
              </div>
              <div class="form-item">
                <label>水泵型号</label>
                <input type="text" id="fPumpModel" maxlength="80" />
              </div>
              <div class="form-item">
                <label><em>*</em>功率(kW)</label>
                <input type="number" id="fPowerKw" min="0" step="0.01" required />
              </div>
              <div class="form-item">
                <label>额定电压</label>
                <input type="text" id="fVoltage" maxlength="20" placeholder="如：10kV / 380V" />
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>技术参数</legend>
            <div class="form-grid">
              <div class="form-item">
                <label>流量(m³/h)</label>
                <input type="number" id="fFlowM3h" min="0" step="0.01" />
              </div>
              <div class="form-item">
                <label>扬程(m)</label>
                <input type="number" id="fHeadM" min="0" step="0.01" />
              </div>
              <div class="form-item">
                <label>转速(r/min)</label>
                <input type="number" id="fSpeedRpm" min="0" step="1" />
              </div>
              <div class="form-item">
                <label>额定电流(A)</label>
                <input type="number" id="fCurrentA" min="0" step="0.01" />
              </div>
              <div class="form-item">
                <label>生产厂家</label>
                <input type="text" id="fManufacturer" maxlength="100" />
              </div>
              <div class="form-item">
                <label>投运日期</label>
                <input type="date" id="fCommissionDate" />
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>管理信息</legend>
            <div class="form-grid">
              <div class="form-item">
                <label><em>*</em>安装位置</label>
                <input type="text" id="fInstallLocation" maxlength="200" required />
              </div>
              <div class="form-item">
                <label><em>*</em>责任班组</label>
                <input type="text" id="fResponsibleTeam" maxlength="50" placeholder="如：取水班组" required />
              </div>
              <div class="form-item">
                <label><em>*</em>运行状态</label>
                <select id="fStatus" required>
                  <option value="运行">运行</option>
                  <option value="备用">备用</option>
                  <option value="检修">检修</option>
                  <option value="停用">停用</option>
                </select>
              </div>
              <div class="form-item form-item-full">
                <label>备注</label>
                <textarea id="fRemark" maxlength="1000" rows="2" placeholder="检修记录、轮换说明等"></textarea>
              </div>
            </div>
          </fieldset>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" data-close="formModal">取消</button>
        <button class="btn btn-primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="detailModal" hidden>
    <div class="modal modal-xl">
      <div class="modal-header">
        <h3>设备档案详情</h3>
        <button class="modal-close" data-close="detailModal">×</button>
      </div>
      <div class="modal-body" id="detailBody">
        <div class="loading-cell">加载中...</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" data-close="detailModal">关闭</button>
        <button class="btn btn-primary" id="btnDetailEdit">编辑</button>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-mask modal-sm-mask" id="confirmModal" hidden>
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 id="confirmTitle">确认操作</h3>
      </div>
      <div class="modal-body">
        <p id="confirmMessage" class="confirm-msg"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" data-close="confirmModal">取消</button>
        <button class="btn btn-danger" id="btnConfirmOk">确认</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/js/app.js"></script>
</body>
</html>
